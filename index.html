    <style>

        .ticket-card {
            background: #1e1e1e;

            border-radius: 12px;
            padding: 24px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .ticket-card:hover {
            transform: translateY(-5px);
            border-color: #22c55e;
        }
        .ticket-info {
            text-align: left;
        }
        .ticket-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .ticket-desc {
            font-size: 0.9rem;
            color: #888;
        }
        .price-tag {
            font-size: 1.5rem;
            font-weight: bold;
            color: #22c55e;
            margin-bottom: 10px;
        }
        .btn-buy {
            display: inline-block;
            background-color: #22c55e;
            color: #000000;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .btn-buy:hover {
            background-color: #16a34a;
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLAN & Digital Ticket Kiosk</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #4CAF50;
            margin-bottom: 5px;
        }
        .header p {
            color: #aaa;
            font-size: 0.9rem;
        }
        .kiosk-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .ticket-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ticket-title {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .ticket-desc {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }
        .price-tag {
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 8px;
            text-align: right;
        }
        .btn-buy {
            background-color: #4CAF50;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            transition: background 0.2s;
        }
        .btn-buy:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>WLAN & Digital Ticket Kiosk</h1>
        <p>Sofort digital buchen und direkt nutzen</p>
    </div>

    <div class="kiosk-container">
       
        <!-- Ticket Option 1: 1 Stunde -->
        <div class="ticket-card">
            <div class="ticket-info">
                <div class="ticket-title">1 Stunde Zugang</div>
                <div class="ticket-desc">Perfekt für die schnelle Recherche</div>
            </div>
            <div>
                <div class="price-tag">2,00 €</div>
                <a href="https://buy.stripe.com/evq9B0aJMae23G4bTI" class="btn-buy">Jetzt kaufen</a>
            </div>
        </div>

        <!-- Ticket Option 2: 24 Stunden -->
        <div class="ticket-card">
            <div class="ticket-info">
                <div class="ticket-title">24 Stunden Pass</div>
                <div class="ticket-desc">Voller Zugriff für einen ganzen Tag</div>
            </div>
            <div>
                <div class="price-tag">5,00 €</div>
                <a href="https://buy.stripe.com/eVq00bajMaZ6g34abT5c400="btn-buy">Jetzt kaufen</a>
            </div>
        </div>

        <!-- Ticket Option 3: 7 Tage -->
        <div class="ticket-card">
            <div class="ticket-info">
                <div class="ticket-title">7 Tage Wochenpass</div>
                <div class="ticket-desc">Dauerhaft verbunden zum Vorteilspreis</div>
            </div>
            <div>
                <div class="price-tag">15,00 €</div>
                <a href="https://buy.stripe.com/eVq00bajMaZ6g34abT5c400="btn-buy">Jetzt kaufen</a>
            </div>
        </div>

    </div>

</body>
</html>
